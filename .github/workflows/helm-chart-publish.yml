name: Hosting - Publish Helm chart to GHCR

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CHART_DIR: hosting/kubernetes/chart

    steps:
      - uses: actions/checkout@v7

      - name: Extract version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - uses: azure/setup-helm@v3
        with: { version: v3.14.3 }

      - run: helm dependency update "$CHART_DIR"

      - name: Update Chart.yaml appVersion
        if: env.VERSION != ''
        run: |
          sed -i "s/^appVersion:.*/appVersion: '${{ env.VERSION }}'/" "$CHART_DIR/Chart.yaml"

      - name: Package chart
        run: |
          mkdir -p dist
          helm package "$CHART_DIR" --destination dist

      - name: Push chart to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm push dist/*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
